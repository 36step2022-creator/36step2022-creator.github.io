<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AI Jack — Etsy connection</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222;background:#fff}
code{display:block;padding:12px;background:#f2f2f2;border-radius:6px;word-break:break-all;font-size:15px}button{margin-top:10px;padding:8px 14px}</style>
</head>
<body>
<h1>Etsy → AI Jack</h1>
<p id="msg">Copy the code below and paste it into the terminal where <b>etsy_auth.py login</b> is waiting.</p>
<code id="code">—</code>
<button id="copy" type="button">Copy</button>
<p>This page sends nothing anywhere; the code is useful only together with the secret held by the terminal session, and expires in minutes.</p>
<script>
var q = new URLSearchParams(location.search), c = q.get("code"), e = q.get("error");
document.getElementById("code").textContent = c ? location.href : (e ? "Error: " + e : "No code in this address.");
if (!c) document.getElementById("msg").textContent = "Etsy did not return a code.";
document.getElementById("copy").onclick = function () { navigator.clipboard && navigator.clipboard.writeText(document.getElementById("code").textContent); };
</script>
</body>
</html>
